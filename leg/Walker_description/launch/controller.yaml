Walker_controller:
  # Publish all joint states -----------------------------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  # Position Controllers --------------------------------------
  hip_roll_position_controller:
    type: effort_controllers/JointPositionController
    joint: hip_roll
    pid: {p: 100.0, i: 0.01, d: 10.0}
  hip_pitch_position_controller:
    type: effort_controllers/JointPositionController
    joint: hip_pitch
    pid: {p: 100.0, i: 0.01, d: 10.0}
  knee_pitch1_position_controller:
    type: effort_controllers/JointPositionController
    joint: knee_pitch1
    pid: {p: 100.0, i: 0.01, d: 10.0}
  knee_pitch2_position_controller:
    type: effort_controllers/JointPositionController
    joint: knee_pitch2
    pid: {p: 100.0, i: 0.01, d: 10.0}
  ankle_pitch_position_controller:
    type: effort_controllers/JointPositionController
    joint: ankle_pitch
    pid: {p: 100.0, i: 0.01, d: 10.0}
  ankle_roll_position_controller:
    type: effort_controllers/JointPositionController
    joint: ankle_roll
    pid: {p: 100.0, i: 0.01, d: 10.0}
