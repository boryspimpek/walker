    pid: {p: 100.0, i: 0.01, d: 10.0}
  Revolute 103_position_controller:
    type: effort_controllers/JointPositionController
    joint: Revolute 103
    pid: {p: 100.0, i: 0.01, d: 10.0}
  Revolute 104_position_controller:
    type: effort_controllers/JointPositionController
    joint: Revolute 104
    pid: {p: 100.0, i: 0.01, d: 10.0}
